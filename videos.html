<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Watch Tango Football Club videos including highlights, matchday action, and championship celebrations.">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://example.com/videos.html">
    <link rel="icon" type="image/jpeg" href="images/tangoforces.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos — Tango Football Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/videos.css">
    <link rel="stylesheet" href="css/index.css">
    <script src="js/components.js" defer></script>
</head>
<body>

    <main-header></main-header>
    <mobile-nav></mobile-nav>

    <main id="main-content">
        <section class="gallery-header">
            <h2>Club Video Room</h2>
            <p>Match highlights, matchday tactical logs, and celebration reels from Tango FC</p>
        </section>

        <section class="video-filters" id="videoFilters">
            <!-- Filter buttons will be dynamically generated here -->
        </section>

        <section class="gallery-container" id="videoContainer">
            <!-- Video sections and cards will be dynamically loaded here -->
        </section>
    </main>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Video preview" hidden>
        <div class="lightbox-content-wrapper">
            <button type="button" class="close-btn" onclick="closeLightbox()" aria-label="Close video preview">✖</button>
            <video id="lightboxVideo" controls controlsList="nodownload" aria-label="Video preview"></video>
        </div>
    </div>

    <main-footer></main-footer>

    <script src="js/videos.js"></script>
</body>
</html>
