<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Browse Tango Football Club gallery highlights, matchday moments, and championship celebrations.">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://example.com/gallery.html">
    <link rel="icon" type="image/jpeg" href="images/tangoforces.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Tango Football Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/index.css">
    <script src="js/components.js" defer></script>
    <script src="js/lazy-images.js" defer></script>
</head>
<body>

    <main-header></main-header>
    <mobile-nav></mobile-nav>

    <main id="main-content">
        <section class="page-hero">
            <h2>Photo Gallery</h2>
            <p>Capturing intense matchday action, trophy celebrations, and behind-the-scenes moments</p>
        </section>

        <div class="gallery-filters" id="galleryFilters">
            <button class="active" onclick="filterGallery('all')">All Photos</button>
            <button onclick="filterGallery('newseason')">2026 Season</button>
            <button onclick="filterGallery('matchday')">Matchday</button>
            <button onclick="filterGallery('champions')">Champions</button>
        </div>

        <div class="gallery-container" id="galleryContainer">
            <section class="subsection" id="sect-newseason">
                <h3>2026 Season</h3>
                <div class="gallery-grid" id="newseasonPicturesGrid">
                </div>
            </section>
            <section class="subsection" id="sect-matchday">
                <h3>Matchday</h3>
                <div class="gallery-grid" id="matchdayPicturesGrid">
                </div>
            </section>
            <section class="subsection" id="sect-champions">
                <h3>Champions</h3>
                <div class="gallery-grid" id="celebrationsPicturesGrid">
                </div>
            </section>
        </div>
    </main>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image gallery preview" hidden>
        <div class="lightbox-content-container">
            <button type="button" class="close-btn" onclick="closeLightbox()" aria-label="Close image preview">✖</button>
            <button type="button" class="lightbox-nav-btn prev-btn" onclick="changeImage(-1)" aria-label="View previous image">
                <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
            </button>
            <img id="lightboxImage" src="" alt="Enlarged View">
            <button type="button" class="lightbox-nav-btn next-btn" onclick="changeImage(1)" aria-label="View next image">
                <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <main-footer></main-footer>

    <script src="js/gallery.js"></script>
</body>
</html>
