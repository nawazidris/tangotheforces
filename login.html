<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Tango FC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-bg">
        <div class="login-bg-glow glow-1"></div>
        <div class="login-bg-glow glow-2"></div>
    </div>

    <div class="login-card">

        <div class="login-brand">
            <div class="login-logo-wrap">
                <img src="images/tangoforces.jpg" alt="Tango FC Logo">
            </div>
            <h1>Tango FC</h1>
            <p>Admin Portal</p>
        </div>

        <form id="loginForm" autocomplete="off">

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                        autocomplete="username"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="toggle-pw" id="togglePw" tabindex="-1" aria-label="Show password">
                        <i class="fa-solid fa-eye" id="togglePwIcon"></i>
                    </button>
                </div>
            </div>

            <p id="error" class="error-msg" aria-live="polite"></p>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Sign In</span>
                <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
            </button>

        </form>

        <p class="login-footer-note">
            <i class="fa-solid fa-shield-halved"></i>
            Authorised personnel only
        </p>

    </div>

    <script>
        // Password toggle
        document.getElementById('togglePw').addEventListener('click', () => {
            const input = document.getElementById('password');
            const icon  = document.getElementById('togglePwIcon');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn     = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const error   = document.getElementById('error');

            // Loading state
            btn.classList.add('loading');
            btnText.textContent = 'Signing in…';
            btnIcon.className = 'fa-solid fa-circle-notch fa-spin';
            error.textContent = '';

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // In a real app, this would be a server call. For this demo, we use a local user map.
            const users = {
                'admin': { pass: 'tango123', role: 'Admin', name: 'Admin User' },
                'coach': { pass: 'coachpass', role: 'Coach', name: 'Coach Pride' },
                'logistics': { pass: 'logisticspass', role: 'Logistics', name: 'Milton Bosha' }
            };

            const handleLogin = (username, password) => {
                const userData = users[username];
                if (userData && userData.pass === password) {
                    return { success: true, user: { name: userData.name, role: userData.role } };
                }
                return { success: false };
            };

            const loginResult = await handleLogin(user, pass);

            if (loginResult.success) {
                // Store the entire user object in sessionStorage for the app to use
                sessionStorage.setItem('tangoUser', JSON.stringify(loginResult.user));
                btnText.textContent = 'Redirecting…';
                window.location.href = 'admin.html';
            } else {
                btn.classList.remove('loading');
                btnText.textContent = 'Sign In';
                btnIcon.className = 'fa-solid fa-arrow-right';
                btn.classList.add('shake');
                setTimeout(() => btn.classList.remove('shake'), 500);
                error.textContent = 'Invalid username or password.';
            }
        });
    </script>

</body>
</html>
